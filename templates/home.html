<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Predictor</title>
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4361ee;
            --primary-hover: #3a56d4;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --card-bg: #ffffff;
            --text-dark: #1a1a2e;
            --text-muted: #6c757d;
            --success-bg: #e8f5e9;
            --success-border: #4caf50;
            --success-text: #2e7d32;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            margin: 0;
        }

        .predictor-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
            padding: 2.5rem;
            width: 100%;
            max-width: 580px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .predictor-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.12);
        }

        .header-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-section h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .header-section p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .form-label {
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 0.4rem;
        }

        .form-select, .form-control {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid #dee2e6;
            transition: all 0.2s ease;
        }

        .form-select:focus, .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .btn-predict {
            background: var(--primary);
            border: none;
            border-radius: 12px;
            padding: 0.85rem;
            font-weight: 600;
            font-size: 1.05rem;
            width: 100%;
            margin-top: 0.5rem;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .btn-predict:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .result-box {
            margin-top: 1.5rem;
            background: var(--success-bg);
            border-left: 4px solid var(--success-border);
            padding: 1rem 1.25rem;
            border-radius: 10px;
            font-weight: 600;
            color: var(--success-text);
            text-align: center;
            animation: fadeInSlide 0.4s ease-out;
        }

        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-hint {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        @media (max-width: 576px) {
            .predictor-card { padding: 1.5rem; }
            .header-section h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="predictor-card">
        <div class="header-section">
            <h1>🎓 Student Exam Performance Predictor</h1>
            <p>Enter student details to predict the Mathematics score</p>
        </div>

        <form action="{{ url_for('predict_datapoint') }}" method="post">
            <div class="mb-3">
                <label class="form-label">Gender</label>
                <select class="form-select" name="gender" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Race / Ethnicity</label>
                <select class="form-select" name="ethnicity" required>
                    <option value="" disabled selected>Select Group</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Parental Level of Education</label>
                <select class="form-select" name="parental_level_of_education" required>
                    <option value="" disabled selected>Select Education Level</option>
                    <option value="associate's degree">Associate's Degree</option>
                    <option value="bachelor's degree">Bachelor's Degree</option>
                    <option value="high school">High School</option>
                    <option value="master's degree">Master's Degree</option>
                    <option value="some college">Some College</option>
                    <option value="some high school">Some High School</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Lunch Type</label>
                <select class="form-select" name="lunch" required>
                    <option value="" disabled selected>Select Lunch Type</option>
                    <option value="free/reduced">Free / Reduced</option>
                    <option value="standard">Standard</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Test Preparation Course</label>
                <select class="form-select" name="test_preparation_course" required>
                    <option value="" disabled selected>Select Status</option>
                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Reading Score</label>
                    <input class="form-control" type="number" name="reading_score" placeholder="e.g., 75" min="0" max="100" required>
                    <div class="input-hint">Range: 0 - 100</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Writing Score</label>
                    <input class="form-control" type="number" name="writing_score" placeholder="e.g., 82" min="0" max="100" required>
                    <div class="input-hint">Range: 0 - 100</div>
                </div>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-predict">Predict Math Score 📊</button>
            </div>
        </form>

        {% if results %}
        <div class="result-box">
            📈 Predicted Mathematics Score: <strong>{{ results }}</strong>
        </div>
        {% endif %}
    </div>
</body>
</html>
